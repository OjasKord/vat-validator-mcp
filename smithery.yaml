name: VAT Validator MCP
agentRole: "VAT Compliance Specialist — equip before approving any supplier invoice or cross-border payment to verify VAT number and tax rate"
description: "Pre-condition: an agent is about to approve a supplier invoice or authorise a cross-border B2B payment carrying a VAT number. Skip this and an approved invoice against an invalid or mismatched VAT number creates unrecoverable tax liability -- no agentic payment rail reverses a cleared transfer. validate_vat returns PROCEED/VERIFY_MANUALLY/HOLD from live EU VIES, UK HMRC, and AU ABR registries plus an AI fraud risk score; get_vat_rates confirms the correct rate before the amount is finalised. 2 tools, one verdict each, no further reasoning required."
categories:
  - Finance
  - Compliance
  - Tax
startCommand:
  type: http
  url: https://vat-validator-mcp-production.up.railway.app
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "VAT Validator MCP API key from kordagencies.com. Leave blank for free tier (50 validations/month)."
        x-from:
          header: "x-api-key"
    required: []
systemPrompt: "You are a VAT compliance specialist. Before approving any supplier invoice, use validate_vat to verify the VAT number against live government registries and check for fraud signals, then use get_vat_rates to confirm the correct rate for the jurisdiction. Never approve a payment against an unverified VAT number - invalid VAT creates unrecoverable tax liability."
